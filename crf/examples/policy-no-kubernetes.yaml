crf_version: "0.1.0"

entity:
  id: "44444444-4444-4444-4444-444444444444"
  type: policy
  name: "Kubernetes Migration Moratorium"
  description: "Temporary policy prohibiting migration to Kubernetes until security audit and team readiness assessment is complete"

  attributes:
    policy_type: architectural
    enforcement: mandatory
    scope: "All production workloads and new infrastructure deployments"
    rationale: |
      This policy was established following the Q3 2023 security review which identified:
      1. Insufficient team expertise in Kubernetes security hardening
      2. Pending completion of container security tooling evaluation
      3. Need for updated incident response runbooks for containerized workloads

      The moratorium allows time for proper preparation before any Kubernetes adoption.
    exceptions_process: |
      Exceptions require:
      1. Written justification from requesting team lead
      2. Security team sign-off on risk mitigation plan
      3. VP Engineering approval
      4. Documented rollback plan
    owner: "VP Engineering"
    review_cycle: "quarterly"

  validity:
    valid_from: "2023-10-01T00:00:00Z"
    valid_until: "2024-06-30T23:59:59Z"  # Originally Q4 2024, moved up

  relationships:
    - target_id: "11111111-1111-1111-1111-111111111111"
      type: constrains
      description: "Applies to all ACME Corporation systems"
    - target_id: "33333333-3333-3333-3333-333333333333"
      type: constrains
      description: "Specifically constrains production infrastructure changes"
    - target_id: "77777777-7777-7777-7777-777777777777"
      type: depends_on
      description: "Policy depends on security audit completion"

  provenance:
    source: "manual"
    created_at: "2023-10-01T00:00:00Z"
    created_by: "security@acme.com"
    updated_at: "2024-01-15T00:00:00Z"
    updated_by: "vp-engineering@acme.com"

  tags:
    - "policy"
    - "kubernetes"
    - "security"
    - "moratorium"
    - "architectural"

