        criticality: high
      - name: "Avalara"
        type: "tax_calculation"
        criticality: high
    compliance:
      - "PCI DSS Level 1"
      - "SOC 2 Type II"
    security:
      encryption_at_rest: true
      encryption_in_transit: true
      key_management: "AWS KMS with annual rotation"
      access_control: "RBAC via IAM + application-level roles"
      audit_logging: true
      penetration_test_frequency: "quarterly"

