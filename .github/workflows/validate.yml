name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-examples:
    name: Validate examples against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Check schemas are valid JSON Schema
        run: |
          python3 - <<'EOF'
          import json
          from jsonschema import Draft7Validator
          for path in ("drf/schema/drf-schema.json", "crf/schema/crf-schema.json"):
              with open(path) as f:
                  Draft7Validator.check_schema(json.load(f))
              print(f"ok    {path}")
          EOF

      - name: Validate examples
        run: python3 scripts/validate-examples.py
