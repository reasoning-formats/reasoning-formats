name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schemas, examples, semantics, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: pip install -r requirements-dev.txt

      - name: Check schemas are valid JSON Schema
        run: |
          python3 - <<'EOF'
          import json
          from jsonschema import Draft7Validator
          for path in ("drf/schema/drf-schema.json", "crf/schema/crf-schema.json"):
              with open(path) as f:
                  Draft7Validator.check_schema(json.load(f))
              print(f"ok    {path}")
          EOF

      - name: Validate examples against the schemas
        run: python3 scripts/validate-examples.py

      - name: Assert invalid documents are rejected
        run: python3 scripts/test-schemas.py

      - name: Check semantic validation rules
        run: python3 scripts/validate-semantics.py --strict

      - name: Validate YAML embedded in documentation
        run: python3 scripts/validate-docs.py

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo
            echo "CONTRIBUTING.md requires a DCO sign-off on every commit."
            echo "Amend with: git commit --amend -s   (or git rebase --signoff)"
            exit 1
          fi
          echo "ok    all commits signed off"
