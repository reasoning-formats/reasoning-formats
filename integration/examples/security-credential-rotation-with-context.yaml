drf_version: "0.2.0"

decision:
  id: "c7a3e1b0-4d2f-4e8a-9b1c-3f5a7e9d2b40"
  title: "Full Credential Rotation After API Key Compromise"
  domain: "security"
  intent: "Determine the appropriate credential rotation scope after detecting compromised API keys, balancing thoroughness against service disruption risk"
  related_decisions:
    - id: "c7a3e1b0-4d2f-4e8a-9b1c-3f5a7e9d2b41"
      relationship: "triggers"
      description: "Post-incident review will evaluate secrets management architecture"

context:
  constraints:
    - description: "Incident response SLA requires containment within 4 hours"
      source: "regulatory"
      negotiable: false
    - description: "PCI DSS requires immediate revocation of potentially exposed credentials"
      source: "regulatory"
      negotiable: false
    - description: "Production services must maintain 99.9% availability during rotation"
      source: "business"
      negotiable: true
  objectives:
    - description: "Eliminate all access paths from compromised credentials within 4 hours"
      priority: "must_have"
      measurable: true
    - description: "Produce complete audit trail for compliance"
      priority: "must_have"
      measurable: true
    - description: "Maintain customer-facing service availability above 99.9%"
      priority: "must_have"
      measurable: true
  environment:
    technical: "42 microservices across 3 AWS accounts. HashiCorp Vault and AWS Secrets Manager. 340 active credentials."
    organizational: "Security team of 5, 2 SREs on-call. Incident escalated to CISO."
    temporal: "Incident detected 1:47 AM EST 2024-08-12. Containment deadline: 5:47 AM EST. Peak hours begin 9:00 AM EST."

cognitive_state:
  phase: "decision"
  confidence: 70
  phase_notes: "Blast radius analysis completed but uncertainty remains. Forensic analysis ongoing. Time pressure limits full scope validation."

reasoning:
  patterns_applied:
    - risk_based
    - systematic
    - deliberative
    - contrafactual
  notes: "Risk-based analysis weighed lateral movement probability against full rotation cost. Contrafactual: if targeted rotation is insufficient and attacker has broader access, exposure extends by days. Favors over-rotation given regulatory exposure."

interventions:
  - id: "int-sec-001"
    type: "challenge"
    content: "Full rotation of 340 credentials risks cascading failures. Can we limit to 23 credentials in compromised namespace?"
    source: "Senior SRE"
    timestamp: "2024-08-12T02:30:00Z"
    impact: "Forced explicit risk quantification; led to phased approach"
  - id: "int-sec-002"
    type: "constraint"
    content: "PCI DSS Requirement 6.5.3 mandates treating any credential in compromised environment as exposed"
    source: "CISO"
    timestamp: "2024-08-12T02:45:00Z"
    impact: "Elevated scope to full rotation for PCI-scoped credentials"
  - id: "int-sec-003"
    type: "insight"
    content: "Vault dynamic secrets (89 credentials) auto-expire in 1 hour - already rotated by design"
    source: "Platform Engineer"
    timestamp: "2024-08-12T03:15:00Z"
    impact: "Reduced effective rotation scope from 340 to 251 credentials"

assumptions:
  - description: "Attacker access limited to logging service API layer per vendor report"
    validated: false
    confidence: 55
    source: "Vendor incident response communication"
  - description: "Vault dynamic secrets have already expired and rotated automatically"
    validated: true
    confidence: 95
    source: "Vault audit log verification"

unresolved_tensions:
  - description: "Full rotation scope exceeds forensic evidence justification"
    impact: "medium"
    mitigation: "Phased rotation prioritizes PCI-scoped credentials first"
    accepted_by: "CISO"
  - description: "Vendor incident report may be incomplete, leaving true blast radius unknown"
    impact: "high"
    mitigation: "Full rotation regardless of vendor assurances; independent forensic review contracted"
    accepted_by: "CISO"
  - description: "Two legacy services require 5-10 minute downtime for credential rotation"
    impact: "medium"
    mitigation: "Schedule during lowest-traffic window; activate maintenance pages"
    accepted_by: "VP Engineering"

synthesis:
  decision: "Execute full credential rotation in three phases: Phase 1 (immediate) PCI-scoped and external API keys (47 credentials); Phase 2 (within 4 hours) internal service credentials (156 credentials); Phase 3 (next maintenance window) legacy services requiring downtime (48 credentials)"
  rationale: "Full rotation justified by PCI DSS requirements, incomplete forensic evidence, and vendor trust deficit. Phased approach balances urgency with operational safety. Dynamic secrets excluded as self-rotated. Cost of over-rotating is far lower than cost of under-rotating."
  follow_ups:
    - action: "Complete Phase 1 PCI and external credential rotation"
      owner: "Security Engineer On-Call"
    - action: "Execute Phase 2 internal credential rotation"
      owner: "SRE On-Call"
    - action: "Schedule Phase 3 legacy service rotation"
      owner: "Platform Team Lead"
    - action: "Complete independent forensic analysis"
      owner: "Security Team"
    - action: "Prepare board security briefing"
      owner: "CISO"
  alternatives:
    - decision: "Targeted rotation of only 23 credentials in compromised namespace"
      rationale_against: "Audit log gap and vendor trust deficit create unacceptable uncertainty. PCI DSS requires treating all potentially-exposed credentials as compromised."
      conditions_for_reconsideration: "If forensic analysis conclusively proves no lateral movement"
    - decision: "Simultaneous rotation of all 340 credentials"
      rationale_against: "Unnecessary service disruption risk; dynamic secrets already rotated"
      conditions_for_reconsideration: "If evidence of active ongoing exploitation discovered"

