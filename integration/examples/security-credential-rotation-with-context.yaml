# CONTEXT VALIDATION - Links this decision to CRF entities
# ============================================================================
context_validation:
  validated_at: "2024-08-12T03:30:00Z"

  context_refs:
    # Reference to PCI DSS Compliance Policy - VIOLATED due to credential exposure
    - context_id: "a1b1c1d1-e1f1-4a1b-8c1d-1e1f1a1b1c1f"
      context_type: policy
      context_name: "PCI DSS Compliance Policy"
      validation_status: violated
      advisory_notes: |
        POLICY VIOLATION - EXCEPTION ACKNOWLEDGED

        The credential compromise constitutes a potential PCI DSS violation:
        - Requirement 3.6.8: Cryptographic key management procedures compromised
        - Requirement 6.5.3: Credential exposure in third-party integration
        - Requirement 12.10.1: Incident response plan activated

        Exception handling:
        1. Incident response plan activated per Requirement 12.10.1
        2. Full credential rotation initiated as compensating control
        3. CISO approved phased approach at 2024-08-12T02:50:00Z
        4. QSA (Coalfire Systems) notified per breach notification procedures
        5. Compensating control: full rotation + independent forensic review

        Reference: Incident ticket INC-2024-0812-001
        QSA notification: QSA-NOTIFY-2024-0812

    # Reference to Payment Processing Service - affected system
    - context_id: "a1b1c1d1-e1f1-4a1b-8c1d-1e1f1a1b1c1d"
      context_type: system
      context_name: "Payment Processing Service"
      validation_status: acknowledged
      advisory_notes: |
        Payment Processing Service is in Phase 1 rotation scope due to PCI DSS classification.
        Stripe and PayPal API credentials prioritized for immediate rotation.
        Service availability maintained via rolling credential rotation (Vault-managed keys).
        Legacy payment-gateway-v1 deferred to Phase 3 (requires brief downtime).

    # Reference to ACME Corporation - organizational context
    - context_id: "11111111-1111-1111-1111-111111111111"
      context_type: organization
      context_name: "ACME Corporation"
      validation_status: not_applicable
      advisory_notes: "Referenced for organizational context. Board notification required per incident severity classification."

    # Reference to Production Infrastructure - affected system
    - context_id: "33333333-3333-3333-3333-333333333333"
      context_type: system
      context_name: "Production Infrastructure"
      validation_status: acknowledged
      advisory_notes: "All production infrastructure credentials included in rotation scope. Vault dynamic secrets (database credentials) confirmed auto-rotated."

  # Context this decision PRODUCES
  context_outputs:
