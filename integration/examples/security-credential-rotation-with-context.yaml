            status: "contained"
            detection_time: "2024-08-12T01:47:00Z"
            containment_time: "2024-08-12T05:30:00Z"
            credentials_rotated: 251
            services_affected: 42
            customer_data_exposed: "unconfirmed - forensic analysis pending"
            downtime_minutes: 8
          confidence: 85
          verified: true
          verified_at: "2024-08-12T06:00:00Z"
        provenance:
          source: "decision:c7a3e1b0-4d2f-4e8a-9b1c-3f5a7e9d2b40"
          created_at: "2024-08-12T06:00:00Z"
          created_by: "security@acme.com"
        tags:
          - "incident"
